<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

		Your name:
		<input id='name' type='text'>
		Your age:
		<input id='age' type='text'>
		Your Gender:
		<input id='gender' type='text'>
		Your ID number:
		<input id='id_num' type='text'>
		Your Favorite Animal:
		<input id='animal' type='text'>
		Your Favorite Food:
		<input id='food' type='text'>
		Your Favorite Subject:
		<input id='subject' type='text'>
		Your Favorite Hobby:
		<input id='hobby' type='text'>
		Your Favorite Flower:
		<input id='flower' type='text'>
		Your Favorite Person:
		<input id='person' type='text'>


		<button type="button" onclick="clickButton( document.getElementById('user').value ,document.getElementById('pass').value )">Click Me!</button>

		<script>

		const clickButton = (a,b,c,d,e,f,g,h,i,j) =>{

			const postData = {
				name: a,
    			age: b,
    			gender: c,
    			id_num: d,
    			animal: e,
    			food: f,
    			subject: g,
    			hobby: h,
    			flower: i,
    			person: j
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/usersLogin',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
